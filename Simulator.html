<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SENSTACK — Deposit Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap');

  :root {
    --black: #0a0a0a;
    --black2: #111111;
    --black3: #1a1a1a;
    --black4: #242424;
    --gold: #c9a84c;
    --gold2: #e8c96a;
    --gold3: #8a6f2e;
    --bronze: #7a5c3a;
    --cream: #f0ead8;
    --cream2: #d4c9aa;
    --muted: #6a6057;
    --green: #4a8a6a;
    --green2: #2d5c46;
    --green3: #1a3a2c;
    --danger: #c46a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .particle {
    position: absolute; width: 2px; height: 2px;
    background: var(--gold); border-radius: 50%;
    animation: float linear infinite; opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-10vh); opacity: 0; }
  }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 100px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: rgba(10,10,10,0.97);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .topbar-logo { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--gold); letter-spacing: 3px; }
  .topbar-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* FLASH ALERT */
  #flashAlert {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-30px);
    background: var(--green3); border: 1px solid var(--green);
    color: var(--cream); padding: 12px 20px; border-radius: 30px;
    font-size: 13px; font-family: 'Space Mono', monospace; letter-spacing: 1px;
    z-index: 999; opacity: 0; transition: all 0.35s;
    white-space: nowrap; pointer-events: none; max-width: 90vw;
  }
  #flashAlert.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* STAT CARDS */
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 16px 20px 0;
  }
  .stat-card {
    background: var(--black3);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 12px; padding: 14px;
  }
  .stat-card.big { grid-column: span 2; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 26px; color: var(--green); }
  .stat-val.white { color: var(--cream); font-size: 20px; }
  .stat-val.gold { color: var(--gold); font-size: 20px; }

  /* GOAL BAR */
  .goal-section { padding: 16px 20px 0; }
  .goal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .goal-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .goal-input-wrap { display: flex; align-items: center; gap: 6px; }
  .goal-input-wrap span { font-size: 13px; color: var(--gold); }
  .goal-input {
    background: var(--black3); border: 1px solid rgba(201,168,76,0.2);
    color: var(--cream); font-family: 'Space Mono', monospace; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; width: 90px; text-align: right;
  }
  .goal-input:focus { outline: none; border-color: var(--gold3); }
  .bar-track { height: 6px; background: var(--black4); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.5s ease; width: 0%; }
  .bar-pct { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--green); text-align: right; margin-top: 4px; }

  /* BIZ SELECTOR */
  .section-label { padding: 16px 20px 8px; font-size: 10px; color: var(--gold3); letter-spacing: 3px; text-transform: uppercase; }
  .biz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 20px; }
  .biz-card {
    background: var(--black3); border: 1px solid rgba(201,168,76,0.12);
    border-radius: 12px; padding: 12px; cursor: pointer;
    transition: all 0.2s; user-select: none;
  }
  .biz-card:hover { border-color: rgba(201,168,76,0.3); }
  .biz-card.on { border-color: var(--green); background: rgba(74,138,106,0.08); }
  .biz-icon { font-size: 22px; margin-bottom: 6px; }
  .biz-name { font-size: 12px; font-weight: 500; color: var(--cream); }
  .biz-range { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .biz-toggle {
    display: inline-block; margin-top: 6px;
    padding: 3px 8px; border-radius: 20px; font-size: 9px;
    letter-spacing: 1px; text-transform: uppercase; font-family: 'Space Mono', monospace;
    border: 1px solid var(--muted); color: var(--muted);
  }
  .biz-card.on .biz-toggle { border-color: var(--green); color: var(--green); }

  /* CONTROLS */
  .controls { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px; }
  .speed-row { display: flex; align-items: center; gap: 10px; }
  .speed-label { font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: 1px; }
  .speed-slider { flex: 1; accent-color: var(--gold); }
  .speed-val { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--gold); min-width: 72px; text-align: right; }

  .run-btn {
    width: 100%; padding: 16px;
    background: var(--green3); border: 1px solid var(--green);
    color: var(--cream); border-radius: 12px;
    font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .run-btn:hover { background: rgba(74,138,106,0.2); }
  .run-btn.paused { background: rgba(196,106,42,0.1); border-color: var(--danger); color: var(--danger); }

  /* FEED */
  .feed-header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; }
  .feed-title { font-size: 10px; color: var(--gold3); letter-spacing: 3px; text-transform: uppercase; }
  .clear-btn {
    font-size: 10px; color: var(--muted); background: transparent;
    border: 1px solid rgba(255,255,255,0.08); padding: 4px 10px;
    border-radius: 20px; cursor: pointer; font-family: 'Space Mono', monospace; letter-spacing: 1px;
  }
  .clear-btn:hover { border-color: var(--muted); }

  .feed { display: flex; flex-direction: column; gap: 6px; padding: 0 20px; }

  .deposit-card {
    background: var(--black2);
    border: 1px solid rgba(201,168,76,0.1);
    border-left: 3px solid var(--green);
    border-radius: 0 12px 12px 0;
    padding: 12px 14px;
    animation: slideDown 0.3s ease;
    display: flex; align-items: flex-start; gap: 12px;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dep-icon { font-size: 20px; flex-shrink: 0; }
  .dep-body { flex: 1; }
  .dep-top { display: flex; justify-content: space-between; align-items: baseline; }
  .dep-amount { font-family: 'Space Mono', monospace; font-size: 18px; color: var(--green); }
  .dep-time { font-size: 10px; color: var(--muted); }
  .dep-desc { font-size: 12px; color: var(--cream2); margin-top: 3px; }
  .dep-biz { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }

  .empty-feed {
    text-align: center; padding: 32px 20px;
    color: var(--muted); font-size: 12px; line-height: 1.8;
    border: 1px dashed rgba(201,168,76,0.15);
    border-radius: 12px;
  }
  .empty-feed span { display: block; font-size: 28px; margin-bottom: 8px; }

  /* MILESTONE TOAST */
  .milestone {
    margin: 0 20px; padding: 14px 16px;
    background: linear-gradient(135deg, rgba(74,138,106,0.15), rgba(201,168,76,0.08));
    border: 1px solid var(--green);
    border-radius: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; color: var(--cream); line-height: 1.6;
    text-align: center; display: none; margin-bottom: 8px;
    animation: slideDown 0.4s ease;
  }
  .milestone.show { display: block; }
</style>
</head>
<body>

<div id="particles"></div>
<div id="flashAlert"></div>

<div class="app">

  <div class="topbar">
    <div class="topbar-logo">SENSTACK OS</div>
    <div class="topbar-sub">DEPOSIT SIMULATOR</div>
  </div>

  <!-- STATS -->
  <div class="stat-grid">
    <div class="stat-card big">
      <div class="stat-label">Total Deposited Today</div>
      <div class="stat-val" id="statTotal">$0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Orders</div>
      <div class="stat-val white" id="statCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Order</div>
      <div class="stat-val white" id="statAvg">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Biggest Drop</div>
      <div class="stat-val gold" id="statBig">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This Hour</div>
      <div class="stat-val gold" id="statHour">$0</div>
    </div>
  </div>

  <!-- GOAL BAR -->
  <div class="goal-section">
    <div class="goal-row">
      <div class="goal-label">Daily Goal</div>
      <div class="goal-input-wrap">
        <span>$</span>
        <input type="number" class="goal-input" id="goalInput" value="1000" min="100" step="100">
      </div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-pct" id="barPct">0% of goal</div>
  </div>

  <!-- MILESTONE -->
  <div style="padding: 12px 20px 0;" id="milestoneWrap"></div>

  <!-- BIZ CARDS -->
  <div class="section-label">Your Businesses — tap to activate</div>
  <div class="biz-grid" id="bizGrid"></div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="speed-row">
      <span class="speed-label">Order Speed</span>
      <input type="range" class="speed-slider" id="speedSlider" min="1" max="5" value="2">
      <span class="speed-val" id="speedVal">Medium</span>
    </div>
    <button class="run-btn" id="runBtn" onclick="toggleSim()">▶ START RECEIVING DEPOSITS</button>
  </div>

  <!-- FEED -->
  <div class="feed-header">
    <div class="feed-title">Live Deposit Feed</div>
    <button class="clear-btn" onclick="clearFeed()">RESET</button>
  </div>
  <div class="feed" id="feed">
    <div class="empty-feed"><span>💳</span>Activate your businesses above,<br>set your goal, and hit Start.<br><br>Watch the deposits roll in.</div>
  </div>

</div>

<script>
const BUSINESSES = [
  {
    id: 'mack', name: 'Mack Magic Mobile Bar', icon: '🍹',
    range: [150, 1400],
    orders: ['4hr bartending event','6hr open bar package','wedding bar service','corporate cocktail hour','birthday party bar','2hr mixology setup','anniversary event bar','graduation party package'],
    prefix: 'Booking deposit'
  },
  {
    id: 'stv', name: 'STV / Radio Meltdown', icon: '🎙',
    range: [75, 900],
    orders: ['podcast production','interview segment edit','station ad placement','broadcast sponsorship','promo video edit','radio show package','artist feature slot','voiceover production'],
    prefix: 'Payment received'
  },
  {
    id: 'xoco', name: 'XOCO Designs', icon: '🛋',
    range: [300, 4500],
    orders: ['living room package','bedroom furnishing','design consultation','dining room set','home office setup','staging package','commercial space design','room refresh package'],
    prefix: 'Invoice paid'
  },
  {
    id: 'anim', name: 'Animation Prep', icon: '🎨',
    range: [50, 600],
    orders: ['school workshop','curriculum license','student enrollment','grant milestone','after-school program','summer camp slot','teacher training','district partnership'],
    prefix: 'Funds received'
  }
];

const SPEEDS = { 1: 9000, 2: 4500, 3: 2000, 4: 900, 5: 350 };
const SPEED_LABELS = { 1: 'Slow & steady', 2: 'Medium', 3: 'Fast', 4: 'Very fast', 5: 'Flood mode 🌊' };
const MILESTONES = [
  { pct: 25, msg: 'A quarter of the way there. Keep going.' },
  { pct: 50, msg: 'Halfway to your goal. You\'re doing it.' },
  { pct: 75, msg: '75%. Almost there — push through.' },
  { pct: 100, msg: '🏆 Goal reached. This is what paid looks like.' },
  { pct: 150, msg: '150%. You exceeded your own expectations today.' },
  { pct: 200, msg: '200%. Double the goal. This is your new baseline.' },
];

let active = { mack: true, stv: true, xoco: false, anim: false };
let running = false;
let timer = null;
let total = 0, count = 0, biggest = 0, hourTotal = 0, hourStart = Date.now();
let shownMilestones = new Set();

// PARTICLES
const particlesEl = document.getElementById('particles');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*20}s;`;
  particlesEl.appendChild(p);
}

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function rand(min, max) {
  return Math.round(min + Math.random() * (max - min));
}

function buildBizGrid() {
  const grid = document.getElementById('bizGrid');
  grid.innerHTML = '';
  BUSINESSES.forEach(b => {
    const d = document.createElement('div');
    d.className = 'biz-card' + (active[b.id] ? ' on' : '');
    d.id = 'biz-' + b.id;
    d.innerHTML = `
      <div class="biz-icon">${b.icon}</div>
      <div class="biz-name">${b.name}</div>
      <div class="biz-range">${fmt(b.range[0])} – ${fmt(b.range[1])}</div>
      <div class="biz-toggle">${active[b.id] ? 'ACTIVE' : 'OFF'}</div>`;
    d.onclick = () => {
      active[b.id] = !active[b.id];
      d.classList.toggle('on', active[b.id]);
      d.querySelector('.biz-toggle').textContent = active[b.id] ? 'ACTIVE' : 'OFF';
    };
    grid.appendChild(d);
  });
}

function getActiveBizzes() {
  return BUSINESSES.filter(b => active[b.id]);
}

function dropDeposit(biz) {
  const amount = rand(biz.range[0], biz.range[1]);
  const order = biz.orders[Math.floor(Math.random() * biz.orders.length)];
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

  total += amount;
  count++;
  if (amount > biggest) biggest = amount;

  // hour tracker
  if (Date.now() - hourStart > 3600000) { hourTotal = 0; hourStart = Date.now(); }
  hourTotal += amount;

  updateStats();
  addToFeed(biz, amount, order, timeStr);
  showFlash(biz, amount);
  updateBar();
  checkMilestones();
}

function addToFeed(biz, amount, order, timeStr) {
  const feed = document.getElementById('feed');
  // remove empty state
  const empty = feed.querySelector('.empty-feed');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'deposit-card';
  card.innerHTML = `
    <div class="dep-icon">${biz.icon}</div>
    <div class="dep-body">
      <div class="dep-top">
        <div class="dep-amount">${fmt(amount)}</div>
        <div class="dep-time">${timeStr}</div>
      </div>
      <div class="dep-desc">${biz.prefix}: ${order}</div>
      <div class="dep-biz">${biz.name}</div>
    </div>`;
  feed.insertBefore(card, feed.firstChild);
  if (feed.children.length > 50) feed.removeChild(feed.lastChild);
}

function showFlash(biz, amount) {
  const el = document.getElementById('flashAlert');
  el.textContent = `${biz.icon}  ${fmt(amount)} deposited`;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

function updateStats() {
  document.getElementById('statTotal').textContent = fmt(total);
  document.getElementById('statCount').textContent = count;
  document.getElementById('statAvg').textContent = count ? fmt(Math.round(total / count)) : '—';
  document.getElementById('statBig').textContent = biggest ? fmt(biggest) : '—';
  document.getElementById('statHour').textContent = fmt(hourTotal);
}

function updateBar() {
  const goal = parseInt(document.getElementById('goalInput').value) || 1000;
  const pct = Math.min(200, (total / goal) * 100);
  document.getElementById('barFill').style.width = Math.min(100, pct) + '%';
  document.getElementById('barFill').style.background = pct >= 100 ? 'var(--gold)' : 'var(--green)';
  document.getElementById('barPct').textContent = Math.round(pct) + '% of goal';
}

function checkMilestones() {
  const goal = parseInt(document.getElementById('goalInput').value) || 1000;
  const pct = (total / goal) * 100;
  MILESTONES.forEach(m => {
    if (pct >= m.pct && !shownMilestones.has(m.pct)) {
      shownMilestones.add(m.pct);
      showMilestone(m.msg);
    }
  });
}

function showMilestone(msg) {
  const wrap = document.getElementById('milestoneWrap');
  const el = document.createElement('div');
  el.className = 'milestone show';
  el.textContent = msg;
  wrap.innerHTML = '';
  wrap.appendChild(el);
  setTimeout(() => el.style.opacity = '0.5', 5000);
}

function scheduleDrop() {
  const bizzes = getActiveBizzes();
  if (!bizzes.length) return;
  const speed = parseInt(document.getElementById('speedSlider').value);
  const base = SPEEDS[speed];
  const jitter = rand(-base * 0.35, base * 0.35);
  timer = setTimeout(() => {
    if (!running) return;
    const biz = bizzes[Math.floor(Math.random() * bizzes.length)];
    dropDeposit(biz);
    scheduleDrop();
  }, Math.max(250, base + jitter));
}

function toggleSim() {
  if (!getActiveBizzes().length) {
    showFlash({ icon: '⚠️' }, 0);
    document.getElementById('flashAlert').textContent = '⚠️  Turn on at least one business first';
    document.getElementById('flashAlert').classList.add('show');
    setTimeout(() => document.getElementById('flashAlert').classList.remove('show'), 2500);
    return;
  }
  running = !running;
  const btn = document.getElementById('runBtn');
  if (running) {
    btn.textContent = '⏸ PAUSE SIMULATION';
    btn.classList.add('paused');
    scheduleDrop();
  } else {
    btn.textContent = '▶ RESUME SIMULATION';
    btn.classList.remove('paused');
    clearTimeout(timer);
  }
}

function clearFeed() {
  running = false;
  clearTimeout(timer);
  total = 0; count = 0; biggest = 0; hourTotal = 0;
  shownMilestones.clear();
  updateStats();
  updateBar();
  document.getElementById('milestoneWrap').innerHTML = '';
  document.getElementById('feed').innerHTML = '<div class="empty-feed"><span>💳</span>Reset complete. Ready when you are.</div>';
  const btn = document.getElementById('runBtn');
  btn.textContent = '▶ START RECEIVING DEPOSITS';
  btn.classList.remove('paused');
}

document.getElementById('speedSlider').oninput = function() {
  document.getElementById('speedVal').textContent = SPEED_LABELS[this.value];
};
document.getElementById('goalInput').oninput = () => { updateBar(); shownMilestones.clear(); };

buildBizGrid();
</script>
</body>
</html>
